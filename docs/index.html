<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAT 2150 Study Hub — Statistics &amp; Computing Resources</title>
    <meta name="description" content="Free study hub for STAT 2150 (Statistics and Computing) at the University of Manitoba. Concept checklists, sequenced study plans, and curated resources from MIT, Harvard, Stanford, CMU, Berkeley, and more.">
    <meta name="keywords" content="STAT 2150, statistics, computing, R programming, University of Manitoba, study guide, probability, regression, ANOVA, bootstrapping, Monte Carlo">
    <link rel="canonical" href="https://aarishgilani.github.io/stat2150/">
    <!-- Open Graph -->
    <meta property="og:title" content="STAT 2150 Study Hub — Statistics &amp; Computing">
    <meta property="og:description" content="Free curated study resources, concept checklists, and actionable study plans for STAT 2150 at the University of Manitoba.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aarishgilani.github.io/stat2150/">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="STAT 2150 Study Hub">
    <meta name="twitter:description" content="Free study resources for Statistics and Computing — R programming, probability, hypothesis testing, regression, and more.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>STAT 2150 — Study Hub</h1>
        <nav>
            <button class="tab active" data-target="concept_scope">Concept Scope</button>
            <button class="tab" data-target="study_resources">Study Resources</button>
            <button class="tab" data-target="plans">Study Plans</button>
        </nav>
    </header>
    <main>
        <article id="concept_scope" class="panel active"></article>
        <article id="study_resources" class="panel"></article>
        <article id="plans" class="panel">
            <div class="plans-nav">
                <h2>Study Plans</h2>
                <div class="plan-list" id="plan-list"></div>
            </div>
            <div class="plan-content" id="plan-content"></div>
        </article>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        async function loadMarkdown(file, targetId) {
            try {
                const res = await fetch(file);
                if (!res.ok) throw new Error(`Failed to load ${file}`);
                const md = await res.text();
                document.getElementById(targetId).innerHTML = marked.parse(md);
            } catch (e) {
                document.getElementById(targetId).innerHTML =
                    `<p class="error">Could not load ${file}. Run <code>./build.sh</code> to copy markdown files into docs/.</p>`;
            }
        }

        loadMarkdown('./concept_scope.md', 'concept_scope');
        loadMarkdown('./study_resources.md', 'study_resources');

        // Plans
        const plans = [
            { file: 'plans/part1_r_fundamentals.md', title: 'Part 1: R Programming Fundamentals' }
        ];

        const planList = document.getElementById('plan-list');
        const planContent = document.getElementById('plan-content');

        plans.forEach((plan, i) => {
            const btn = document.createElement('button');
            btn.className = 'plan-btn';
            btn.textContent = plan.title;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadMarkdown(plan.file, 'plan-content');
            });
            planList.appendChild(btn);
        });
    </script>
</body>
</html>
